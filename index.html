<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jardin Virtuel</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap');

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #e0f7e9, #f0f8ff, #fff0f5);
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .container {
            max-width: 700px;
            padding: 20px;
        }

        h1 {
            font-size: 2.8rem;
            color: #2e8b57;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.4rem;
            color: #555;
            margin-bottom: 50px;
        }

        .icons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 40px;
            margin: 40px 0;
        }

        .icon {
            font-size: 5.5rem;
            transition: transform 0.3s ease;
        }

        .icon:hover {
            transform: scale(1.2);
        }

        .dog {
            font-size: 6rem;
            margin-bottom: 20px;
        }

        .message {
            font-size: 1.5rem;
            color: #2e8b57;
            background: rgba(255,255,255,0.8);
            padding: 20px 40px;
            border-radius: 30px;
            display: inline-block;
            margin: 20px 0 50px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .back-btn {
            display: inline-block;
            margin-top: 30px;
            padding: 14px 35px;
            background: #6b7280;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-size: 1.1rem;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: #4b5563;
            transform: scale(1.05);
        }

        footer {
            margin-top: 60px;
            color: #888;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌿 Jardin Virtuel</h1>
        <p class="subtitle">Un espace de calme et de verdure</p>

        <!-- Chien -->
        <div class="dog">🐶</div>
        <div class="message">
            Le jardin sera bientôt ouvert !
        </div>

        <!-- Icônes plantes et arbre -->
        <div class="icons">
            <div class="icon">🌷</div>
            <div class="icon">🌻</div>
            <div class="icon">🌿</div>
            <div class="icon">🌳</div>
        </div>

        <!-- Bouton retour -->
        <a href="https://pierreg78-maker.github.io/Atelier/" class="back-btn">
            ← Retour à l'Atelier Mémoire
        </a>
    </div>

    <footer>
        <p>Atelier Artistique — Revenez bientôt pour cultiver votre jardin 🌱</p>
    </footer>
</body>
</html>
